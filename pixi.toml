[workspace]
authors = ["Brian Rogoff <brogoff@gmail.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "mogeometry"
platforms = ["linux-64"]
version = "0.1.0"
# molina is a pixi-build package (needs pixi 0.84 or newer)
preview = ["pixi-build"]

# pixi compiles molina from source with this Mojo; a .mojoc loads only in
# the compiler that built it, so keep this equal to the mojo pin below
[workspace.build-variants]
mojo-compiler = ["1.3.0.dev2026110305"]

[tasks]
test = "bash tests/run_all.sh"
# release builds: bounds checks (debug_assert) compiled out
test-release = { cmd = "bash tests/run_all.sh", env = { MOJO_FLAGS = "-D ASSERT=none" } }
package = "mkdir -p build && mojo precompile mogeometry -o build/mogeometry.mojoc"
format = "mojo format mogeometry tests benchmarks"
# the element-handle experiment (docs/plan.md; results in AGENTS.md)
bench-handles = "mojo run -D ASSERT=none -I . benchmarks/handles.mojo"
# `pixi run doc-check [--update | --list PATTERN]`: doc string warnings
# against docs/docstring-baseline.txt (see docs/writing-docs.md)
doc-check = "python docs/check_docstrings.py"

[dependencies]
# the nightly MojoDEC's pixi.lock records, so mogeometry can be built
# into MojoDEC later; move it with the build variant above
mojo = "==1.3.0.dev2026110305"
max-core = "==26.8.0.dev2026110305"
# the linear algebra (github.com/bpr/molina); to work on both at once,
# use { path = "../molina" } locally and don't commit it
molina = { git = "https://github.com/bpr/molina", rev = "9e87f60a2724616cde61ed9be01af9356cf509b3" }
python = ">=3.12,<3.14"

# Reference data: C++ drivers that call geometry-central and write the
# expected results to tests/data/<area>/ (see tests/data/README.md).
# geometry-central is found at $GEOMETRY_CENTRAL_PATH (default
# ../../c++/geometry-central); Eigen is the 3.3.9 its CMake downloads.
# `pixi run -e ref ref-data`
[feature.ref.dependencies]
cxx-compiler = "*"
eigen = "==3.3.9"

[feature.ref.tasks]
ref-data = "bash tests/data/build_reference.sh"

[environments]
ref = { features = ["ref"], no-default-feature = true }
