[workspace]
authors = ["Brian Rogoff <brogoff@gmail.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "mogeometry"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
# MojoDEC (sparse matrices, sparse direct and Krylov solvers, eigsh) and
# the NuMojo it vendors, precompiled from $MOJODEC_PATH (default
# ../MojoDEC) into build/ with this workspace's Mojo; see tools/build_deps.sh
deps = "bash tools/build_deps.sh"
test = { cmd = "bash tests/run_all.sh", depends-on = ["deps"] }
# release builds: bounds checks (debug_assert) compiled out
test-release = { cmd = "bash tests/run_all.sh", env = { MOJO_FLAGS = "-D ASSERT=none" }, depends-on = ["deps"] }
package = { cmd = "mojo precompile -I build mogeometry -o build/mogeometry.mojoc", depends-on = ["deps"] }
format = "mojo format mogeometry tests"
# `pixi run doc-check [--update | --list PATTERN]`: doc string warnings
# against docs/docstring-baseline.txt (see docs/writing-docs.md)
doc-check = { cmd = "python docs/check_docstrings.py", depends-on = ["deps"] }

[dependencies]
# the Mojo and MAX that ../MojoDEC/pixi.lock records: MojoDEC and its
# vendored NuMojo are compiled from source here, and newer nightlies can
# break them (2026111805 removed `std.memory.UnsafePointer`); move these
# when MojoDEC moves
mojo = "==1.3.0.dev2026110305"
max-core = "==26.8.0.dev2026110305"
python = ">=3.12,<3.14"
